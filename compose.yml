name: story-graph

services:
  postgres:
    image: postgres:16-alpine
    container_name: story-graph-postrgres
    environment:
      POSTGRES_DB: story_graph
      POSTGRES_USER: story_graph
      POSTGRES_PASSWORD: story_graph
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - story_graph_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U story_graph -d story_graph"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  story_graph_postgres_data:
