name: Drizzle Preview

on:
  pull_request:

jobs:
  generate:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://story_graph:story_graph@localhost:5432/story_graph
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate migration from main metadata
        run: |
          git show origin/main:drizzle/meta/_journal.json > drizzle/meta/_journal.json
          git show origin/main:drizzle/meta/0001_snapshot.json > drizzle/meta/0001_snapshot.json
          rm -f drizzle/0002_*.sql drizzle/meta/0002_snapshot.json
          pnpm db:generate
      - uses: actions/upload-artifact@v4
        with:
          name: drizzle-graph-core
          path: |
            drizzle/0002_*.sql
            drizzle/meta/_journal.json
            drizzle/meta/0002_snapshot.json
