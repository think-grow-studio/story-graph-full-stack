name: Drizzle Preview

on:
  pull_request:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://story_graph:story_graph@localhost:5432/story_graph
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/graph-core
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate migration from main metadata
        run: |
          git show origin/main:drizzle/meta/_journal.json > drizzle/meta/_journal.json
          git show origin/main:drizzle/meta/0001_snapshot.json > drizzle/meta/0001_snapshot.json
          rm -f drizzle/0002_*.sql drizzle/meta/0002_snapshot.json
          pnpm db:generate
      - name: Commit generated migration metadata
        run: |
          if git diff --quiet -- drizzle; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle
          git commit -m "feat: generate graph core migration metadata"
          git push origin HEAD:feat/graph-core
