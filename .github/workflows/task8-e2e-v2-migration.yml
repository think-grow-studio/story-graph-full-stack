name: Task 8 E2E V2 Migration

on:
  push:
    branches:
      - feat/graph-editor-v2
    paths:
      - scripts/task8-e2e-v2-migration.mjs
      - .github/workflows/task8-e2e-v2-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/graph-editor-v2
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply E2E V2 selector migration
        run: node scripts/task8-e2e-v2-migration.mjs

      - name: Verify architecture, lint, types, and unit tests
        run: pnpm check

      - name: Remove temporary migration tooling
        run: |
          rm scripts/task8-e2e-v2-migration.mjs
          rm .github/workflows/task8-e2e-v2-migration.yml

      - name: Commit verified migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "test(e2e): use explicit magnetic ports"
          git push origin HEAD:feat/graph-editor-v2
