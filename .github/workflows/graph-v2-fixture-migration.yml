name: Graph V2 Fixture Migration

on:
  push:
    branches:
      - feat/graph-editor-v2
    paths:
      - scripts/graph-v2-test-fixture-migration.mjs
      - scripts/graph-v2-test-fixture-finalize.mjs
      - .github/workflows/graph-v2-fixture-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/graph-editor-v2
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply V2 fixture migration
        run: |
          node scripts/graph-v2-test-fixture-migration.mjs
          node scripts/graph-v2-test-fixture-finalize.mjs
          git diff --name-only --diff-filter=ACM -z | xargs -0 -r sed -i 's/[[:blank:]]\+$//'

      - name: Verify architecture, lint, types, and unit tests
        run: pnpm check

      - name: Remove temporary migration tooling
        run: |
          rm scripts/graph-v2-test-fixture-migration.mjs
          rm scripts/graph-v2-test-fixture-finalize.mjs
          rm .github/workflows/graph-v2-fixture-migration.yml

      - name: Commit verified migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "test(graph): finish Graph V2 fixture migration"
          git push origin HEAD:feat/graph-editor-v2
