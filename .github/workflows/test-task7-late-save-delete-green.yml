name: Task 7 Late Save Delete GREEN

on:
  push:
    branches:
      - test/task7-late-save-delete-green

jobs:
  focused-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run src/frontend/features/graph-editor/commands/editor-command-runtime.test.ts
