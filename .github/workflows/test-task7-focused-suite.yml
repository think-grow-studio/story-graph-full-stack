name: Task 7 Focused Suite

on:
  push:
    branches:
      - test/task7-focused-suite

jobs:
  focused-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run src/frontend/features/graph-editor/commands src/frontend/features/graph-editor/save-queue src/frontend/features/graph-editor/inspector src/frontend/features/graph-editor/history
