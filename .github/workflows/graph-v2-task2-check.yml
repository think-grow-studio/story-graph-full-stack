name: Graph V2 Task 2 Check

on:
  push:
    branches:
      - feat/graph-editor-v2
    paths:
      - .github/workflows/graph-v2-task2-check.yml

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: story_graph
          POSTGRES_USER: story_graph
          POSTGRES_PASSWORD: story_graph
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U story_graph -d story_graph"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://story_graph:story_graph@localhost:5432/story_graph
      BETTER_AUTH_SECRET: ci-only-secret-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/graph-editor-v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:check
      - run: pnpm vitest run --config vitest.integration.config.ts tests/integration/graph/graph-repository.integration.ts
