name: Bootstrap Foundation Verification

on:
  push:
    branches: [feat/foundation]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm check:agents
      - run: pnpm lint
      - name: Prove architecture import boundaries
        run: |
          cat > src/frontend/__architecture_violation__.ts <<'EOF'
          import { getHealth } from "@/backend/modules/system/application/get-health/get-health.use-case";
          export const violation = getHealth;
          EOF
          if pnpm eslint src/frontend/__architecture_violation__.ts; then
            echo "Expected the frontend/backend import boundary to fail"
            exit 1
          fi
          rm src/frontend/__architecture_violation__.ts
          pnpm eslint src/app/api/v1/health/route.ts
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Commit generated lockfile
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain -- pnpm-lock.yaml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: refresh foundation lockfile"
            git push origin HEAD:feat/foundation
          fi
