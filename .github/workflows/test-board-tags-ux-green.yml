name: Board Tags UX GREEN

on:
  push:
    branches:
      - test/board-tags-ux-green

jobs:
  focused-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run src/frontend/pages/story/story-boards-page.test.tsx src/frontend/pages/story/board-tags.test.ts
