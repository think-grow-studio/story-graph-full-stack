name: Update Swagger Lockfile

on:
  push:
    branches: [feat/auth-workspace-story]
    paths:
      - package.json
      - .github/workflows/update-swagger-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/auth-workspace-story

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Refresh lockfile
        run: pnpm install --lockfile-only

      - name: Commit lockfile on latest branch
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: refresh lockfile for Swagger"
          git pull --rebase origin feat/auth-workspace-story
          git push origin HEAD:feat/auth-workspace-story
