name: Build Diff Diagnostic

on:
  push:
    branches: [feat/graph-editor-v2]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://story_graph:story_graph@localhost:5432/story_graph
      BETTER_AUTH_SECRET: ci-only-secret-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: story_graph
          POSTGRES_USER: story_graph
          POSTGRES_PASSWORD: story_graph
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U story_graph -d story_graph"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          : > build-diff.txt

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Capture after migrations
        run: |
          {
            echo '=== AFTER MIGRATIONS ==='
            git status --short
            git diff --name-status
            git diff --no-ext-diff
            echo
          } >> build-diff.txt

      - name: Check architecture and unit tests
        run: pnpm check

      - name: Capture after check
        run: |
          {
            echo '=== AFTER CHECK ==='
            git status --short
            git diff --name-status
            git diff --no-ext-diff
            echo
          } >> build-diff.txt

      - name: PostgreSQL integration tests
        run: pnpm test:integration

      - name: Capture after integration
        run: |
          {
            echo '=== AFTER INTEGRATION ==='
            git status --short
            git diff --name-status
            git diff --no-ext-diff
            echo
          } >> build-diff.txt

      - name: Production build
        run: pnpm build

      - name: Capture after build
        if: always()
        run: |
          {
            echo '=== AFTER BUILD ==='
            git status --short
            git diff --name-status
            git diff --no-ext-diff
            echo
          } >> build-diff.txt

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-sequence-diff
          path: build-diff.txt
          if-no-files-found: error
