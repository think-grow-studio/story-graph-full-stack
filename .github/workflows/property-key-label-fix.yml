name: Property Key Label Fix

on:
  push:
    branches: [feat/graph-editor-v2]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/graph-editor-v2
      - name: Rename new property key accessibility label
        run: |
          python - <<'PY'
          from pathlib import Path

          roots = [Path('src'), Path('tests')]
          old = '새 속성 이름'
          new = '새 속성 키'
          changed = []
          for root in roots:
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix not in {'.ts', '.tsx'}:
                      continue
                  text = path.read_text()
                  if old not in text:
                      continue
                  path.write_text(text.replace(old, new))
                  changed.append(str(path))
          print('\n'.join(changed))
          PY
      - name: Commit exact label replacement
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src tests
          git commit -m "fix(editor): rename new property key label"
          git push origin HEAD:feat/graph-editor-v2
